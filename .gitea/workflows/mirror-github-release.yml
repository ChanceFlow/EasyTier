# Mirror GitHub Release → Gitea Release
#
# GitHub (public fork, free runners) builds the FULL product matrix
# including Windows/macOS/GUI/APK. This job copies the finished release
# assets into the Gitea instance so intranet users can download them
# locally — it downloads and uploads, it compiles nothing.
#
# This file contains NO server addresses, tokens or secrets:
#   secrets.ET_SERVER_URL  Gitea base url  (Settings -> Actions -> Secrets)
#   secrets.ET_TOKEN       Gitea token with repository write scope
#   secrets.GH_RO_TOKEN      optional GitHub PAT (public releases work without;
#                            never named GITHUB_TOKEN - Gitea auto-injects its
#                            own runner JWT under that name and GitHub rejects it)
#
# It runs daily (cron) resolving the LATEST GitHub release automatically,
# and can also be triggered manually (Gitea -> Actions -> "Mirror GitHub
# Release" -> Run workflow), optionally pinned to a version. Re-runs are
# idempotent: assets already attached under the same name are skipped.
# Set overwrite=true to REPLACE same-named assets (delete + re-upload) -
# use it after a same-version rebuild, when the GitHub release carries
# fresh binaries under the old file names.

name: Mirror GitHub Release

on:
  schedule:
    - cron: '30 1 * * *'   # daily: mirror whatever the latest GitHub release carries
  workflow_dispatch:
    inputs:
      version:
        description: 'GitHub release tag to mirror (empty = latest)'
        type: string
        default: ''
        required: false
      source_repo:
        description: 'GitHub owner/repo that carries the release'
        type: string
        default: 'ChanceFlow/EasyTier'
        required: false
      overwrite:
        description: 'Replace same-named assets on the Gitea release instead of skipping'
        type: boolean
        default: false
        required: false

concurrency:
  # never let two mirror passes race on the same asset table
  group: mirror-github-release
  cancel-in-progress: false

defaults:
  run:
    # Pinned because the et-glue runner image is Alpine, where /bin/sh is
    # busybox ash: it chokes on `[[ ]]` and array append. Do not remove.
    shell: bash

jobs:
  mirror:
    runs-on: et-glue
    env:
      ET_SERVER_URL: ${{ secrets.ET_SERVER_URL }}
      ET_TOKEN: ${{ secrets.ET_TOKEN }}
      GH_RO_TOKEN: ${{ secrets.GH_RO_TOKEN }}
      # NOTE: this Gitea does not populate the `inputs` context on
      # workflow_dispatch (renders empty) - the legacy event path works.
      VERSION: ${{ github.event.inputs.version }}
      SOURCE_REPO: ${{ github.event.inputs.source_repo }}
      OVERWRITE: ${{ github.event.inputs.overwrite }}
    steps:
      - name: Mirror release and assets
        run: |
          set -euo pipefail
          if [[ -z "${ET_TOKEN:-}" ]]; then
            echo "error: secret ET_TOKEN is not set" >&2
            exit 1
          fi

          # A job container cannot reach Gitea directly, and that is measured, not
          # assumed: it sits on its own per-job podman network (10.89.x.0/24, no
          # `gitea` DNS entry), and every direct address - the host gateway, the
          # LAN IPs, the VPN IP - simply drops the connection. The job's HTTP
          # proxy is the one path that works. The runner sets it, but its NO_PROXY
          # also lists the Gitea host, which makes curl and git bypass the proxy
          # and hang for ~135 s. Clearing that is the actual fix.
          export NO_PROXY="localhost,127.0.0.1,::1" no_proxy="localhost,127.0.0.1,::1"

          if [ -z "${ET_SERVER_URL:-}" ]; then
            echo "error: secret ET_SERVER_URL is not set" >&2; exit 1
          fi
          GITEA_BASE=""
          printf '  gitea %-48s ' "$ET_SERVER_URL (via \$HTTP_PROXY)"
          if curl -fsS --max-time 10 -o /dev/null "$ET_SERVER_URL/api/v1/version" 2>/dev/null; then
            echo "reachable"; GITEA_BASE="$ET_SERVER_URL"
          else
            echo "unreachable"
            # Fallback: should this runner ever be attached to the Gitea network
            # instead of a per-job one, the service name will answer directly.
            for cand in http://gitea:3000 http://host.containers.internal:3000; do
              printf '  gitea %-48s ' "$cand (direct)"
              if curl -fsS --noproxy '*' --max-time 5 -o /dev/null "$cand/api/v1/version" 2>/dev/null; then
                echo "reachable"; GITEA_BASE="$cand"; break
              fi
              echo "unreachable"
            done
          fi
          if [ -z "$GITEA_BASE" ]; then
            echo "error: no reachable Gitea base URL" >&2; exit 1
          fi
          echo "==> gitea base: $GITEA_BASE"

          GH_API="https://api.github.com"
          API="$GITEA_BASE/api/v1/repos/${{ github.repository }}"
          AUTH="Authorization: token $ET_TOKEN"
          GH=(-s)
          if [[ -n "${GH_RO_TOKEN:-}" ]]; then GH+=(-H "Authorization: Bearer $GH_RO_TOKEN"); fi

          if [[ -z "${SOURCE_REPO// /}" ]]; then SOURCE_REPO="ChanceFlow/EasyTier"; fi
          VERSION="${VERSION// /}"
          if [[ -z "$VERSION" ]]; then
            echo "==> resolving latest GitHub release of $SOURCE_REPO"
            VERSION=$(curl -fsSL "${GH[@]}" "$GH_API/repos/$SOURCE_REPO/releases/latest" \
              | jq -r '.tag_name')
          fi
          echo "==> mirroring $SOURCE_REPO/$VERSION"

          ghrel=$(curl -fsSL "${GH[@]}" "$GH_API/repos/$SOURCE_REPO/releases/tags/$VERSION")

          # tag must exist AND the release target must match its commit
          # (this Gitea stores empty-sha1 ghosts otherwise); derive from
          # the gitea tag when present, else let the API create it on main.
          TS=$(curl -fsS "$API/git/refs/tags/$VERSION" -H "$AUTH" 2>/dev/null \
            | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p' | head -1 || true)
          [[ -z "$TS" ]] && TS="main"

          relg=$(curl -fsS "$API/releases/tags/$VERSION" -H "$AUTH" 2>/dev/null || true)
          if [[ -z "$relg" ]]; then
            echo "==> creating gitea release"
            reljson=$(jq -n --argjson rel "$ghrel" --arg version "$VERSION" --arg ts "$TS" '{
                tag_name: $version,
                name: ($rel.name // $version),
                body: (($rel.body // "")[:20000]),
                draft: false,
                prerelease: ($rel.prerelease // false),
                target_commitish: $ts,
              }')
            relg=$(curl -fsS -X POST "$API/releases" -H "$AUTH" \
              -H "Content-Type: application/json" -d "$reljson")
          fi
          RID=$(printf '%s' "$relg" | jq -r '.id')
          echo "gitea release id: $RID"

          # idempotency: name + asset id already attached on gitea.
          # OVERWRITE=true replaces same-named assets: the fresh file is
          # downloaded FIRST and only then the stale asset is deleted, so a
          # failed download can never leave the release with fewer files.
          [[ "${OVERWRITE:-false}" == "true" ]] || OVERWRITE=false
          echo "overwrite mode: $OVERWRITE"
          existing=$(printf '%s' "$relg" | jq -r '.assets[]? | "\(.id)\t\(.name)"' 2>/dev/null || true)

          printf '%s' "$ghrel" | jq -r '.assets[]? | "\(.name)\t\(.browser_download_url)"' > /tmp/assets.tsv

          total=$(wc -l < /tmp/assets.tsv)
          count=0
          while IFS=$(printf '\t') read -r fname furl; do
            [[ -n "$fname" ]] || continue
            aid=$(printf '%s\n' "$existing" | awk -F'\t' -v n="$fname" '$2==n {print $1; exit}')
            if [[ -n "$aid" && "$OVERWRITE" != "true" ]]; then
              echo "skip $fname (already attached)"
              continue
            fi
            echo "==> $fname"
            curl -fsSL --retry 3 -o "/tmp/$fname" "$furl"
            if [[ -n "$aid" ]]; then
              # re-read the release: a concurrent pass may have replaced this
              # name with a NEW asset id since our snapshot; delete every id
              # that currently carries the name, tolerating vanished assets.
              cur=$(curl -fsS "$API/releases/$RID" -H "$AUTH" \
                | jq -r --arg n "$fname" '.assets[]? | select(.name == $n) | .id' 2>/dev/null || true)
              if [[ -z "$cur" ]]; then
                cur="$aid"
              fi
              for vid in $cur; do
                echo "overwrite: dropping stale asset $vid"
                curl -fsS -X DELETE "$API/releases/$RID/assets/$vid" -H "$AUTH" -o /dev/null || echo "  (already gone)"
              done
            fi
            ok=false
            for attempt in 1 2 3 4 5; do
              if curl -fsS -X POST "$API/releases/$RID/assets?name=$fname" \
                  -H "$AUTH" -F "attachment=@/tmp/$fname"; then
                ok=true; break
              fi
              echo "attempt $attempt failed, retrying in 5s"; sleep 5
            done
            if [[ "$ok" != true ]]; then
              echo "error: upload failed for $fname" >&2; exit 1
            fi
            count=$((count + 1))
            rm -f "/tmp/$fname"
          done < /tmp/assets.tsv
          echo "==> mirrored $count new assets (of $total total) into gitea release $RID"
