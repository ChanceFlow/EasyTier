# GitHub Release Bridge (Gitea -> GitHub)
#
# This repo's canonical home is the Gitea instance; the public GitHub fork
# exists so the FULL product matrix (Windows/macOS/GUI/APK) builds on free
# GitHub-hosted runners. Pushing this branch's main to the fork natively
# triggers Core/GUI/Mobile runs there, so on push this job only has to
# fast-forward the fork. (dispatch_builds exists solely as a fallback if
# GitHub push triggers ever go silent again - do not enable it together
# with a working push trigger, it would double-schedule via concurrency.)
#
# No server addresses or tokens in this file:
#   secrets.ET_SERVER_URL   Gitea base url
#   secrets.ET_TOKEN        Gitea token (clone canonical repo)
#   secrets.GH_PUSH_TOKEN   GitHub token with repo+workflow scopes

name: GitHub Release Bridge

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dispatch_builds:
        description: 'also force-dispatch Core/GUI/Mobile on the fork (fallback only)'
        type: boolean
        default: false

env:
  GH_REPO: ChanceFlow/EasyTier

defaults:
  run:
    # Pinned because the et-glue runner image is Alpine, where /bin/sh is
    # busybox ash: it chokes on `[[ ]]` and array append. Do not remove.
    shell: bash

jobs:
  bridge:
    runs-on: et-glue
    env:
      ET_SERVER_URL: ${{ secrets.ET_SERVER_URL }}
      ET_TOKEN: ${{ secrets.ET_TOKEN }}
      GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
      DISPATCH_BUILDS: ${{ github.event.inputs.dispatch_builds }}  # 'inputs' ctx renders empty on dispatch in this Gitea
    steps:
      - name: Fast-forward GitHub fork with main
        run: |
          set -euo pipefail
          if [[ -z "${GH_PUSH_TOKEN:-}" || -z "${ET_TOKEN:-}" ]]; then
            echo "error: ET_TOKEN / GH_PUSH_TOKEN secrets required" >&2; exit 1
          fi
          REPO="${{ github.repository }}"

          # A job container cannot reach Gitea directly, and that is measured, not
          # assumed: it sits on its own per-job podman network (10.89.x.0/24, no
          # `gitea` DNS entry), and every direct address - the host gateway, the
          # LAN IPs, the VPN IP - simply drops the connection. The job's HTTP
          # proxy is the one path that works. The runner sets it, but its NO_PROXY
          # also lists the Gitea host, which makes curl and git bypass the proxy
          # and hang for ~135 s. Clearing that is the actual fix.
          export NO_PROXY="localhost,127.0.0.1,::1" no_proxy="localhost,127.0.0.1,::1"

          if [ -z "${ET_SERVER_URL:-}" ]; then
            echo "error: secret ET_SERVER_URL is not set" >&2; exit 1
          fi
          GITEA_BASE=""
          printf '  gitea %-48s ' "$ET_SERVER_URL (via \$HTTP_PROXY)"
          if curl -fsS --max-time 10 -o /dev/null "$ET_SERVER_URL/api/v1/version" 2>/dev/null; then
            echo "reachable"; GITEA_BASE="$ET_SERVER_URL"
          else
            echo "unreachable"
            # Fallback: should this runner ever be attached to the Gitea network
            # instead of a per-job one, the service name will answer directly.
            for cand in http://gitea:3000 http://host.containers.internal:3000; do
              printf '  gitea %-48s ' "$cand (direct)"
              if curl -fsS --noproxy '*' --max-time 5 -o /dev/null "$cand/api/v1/version" 2>/dev/null; then
                echo "reachable"; GITEA_BASE="$cand"; break
              fi
              echo "unreachable"
            done
          fi
          if [ -z "$GITEA_BASE" ]; then
            echo "error: no reachable Gitea base URL" >&2; exit 1
          fi
          echo "==> gitea base: $GITEA_BASE"

          GIT_URL=$(printf '%s' "$GITEA_BASE" | sed "s#://#://x-access-token:${ET_TOKEN}@#")
          WORK=$(mktemp -d)
          # transient curl-18 drops happen on gitea's smart-http; retry like the
          # asset uploader does. --no-checkout skips 1000+ file extraction.
          for attempt in 1 2 3; do
            if git clone -q --no-checkout --single-branch -b main "$GIT_URL/$REPO.git" "$WORK/r"; then
              break
            fi
            rm -rf "$WORK/r"
            [ "$attempt" = 3 ] && { echo "clone failed 3x" >&2; exit 1; }
            echo "clone attempt $attempt failed, retrying in 5s"; sleep 5
          done
          echo "==> gitea main @ $(git -C "$WORK/r" rev-parse --short HEAD) -> github $GH_REPO"

          PUSH_URL=$(printf 'https://x-access-token:%s@github.com/%s.git' "$GH_PUSH_TOKEN" "$GH_REPO")
          if ! git -C "$WORK/r" push "$PUSH_URL" main:main; then
            echo "error: fork rejected the fast-forward (diverged?). Sync manually;" >&2
            echo "       never rewrite fork history behind CI's back." >&2
            exit 1
          fi
          echo "==> fork up to date"

          if [[ "${DISPATCH_BUILDS:-false}" == "true" ]]; then
            API="https://api.github.com/repos/$GH_REPO/actions/workflows"
            for wf in core.yml gui.yml mobile.yml; do
              curl -fsS -X POST -H "Authorization: Bearer $GH_PUSH_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"ref":"main"}' "$API/$wf/dispatches" \
                && echo "force-dispatched $wf" || echo "FAILED to dispatch $wf" >&2
            done
          fi
