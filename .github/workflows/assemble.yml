# Auto-assemble the mobile/desktop/core products into a GitHub Release once
# the full build trio (Core + GUI + Mobile) has finished green on main.
#
# Purely event-driven (workflow_run), so this works even though fork push
# events never fire normal runs. When all three latest-completed main runs
# share one commit and no release exists for the current tag, it dispatches
# upstream's release.yml with the three run ids; when that assembly run
# finishes, the publish job un-drafts it (upstream creates drafts).
#
# Manual override stays available: dispatch release.yml yourself with run ids.

name: Assemble Release

on:
  workflow_run:
    workflows: ["EasyTier Core", "EasyTier GUI", "EasyTier Mobile", "EasyTier Release"]
    types: [completed]

permissions:
  contents: write
  actions: write

jobs:
  trigger-assembly:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.name != 'EasyTier Release' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency: assemble-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Dispatch release.yml when the trio is green on one sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(git describe --tags --abbrev=0 HEAD)
          # Newest successful run of a workflow on main that actually carries
          # artifacts. fkirc/skip-duplicate-actions makes a fully skipped run
          # conclude "success" with zero artifacts, and handing such a run to
          # release.yml fails with "no artifacts found".
          latest() {
            local wf="$1" id sha count
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?branch=main&status=completed&per_page=10" \
                          --jq '.workflow_runs[] | select(.conclusion=="success") | .id'); do
              count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '.total_count')
              if [ "${count:-0}" -gt 0 ]; then
                sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.head_sha')
                echo "$id $sha"
                return 0
              fi
            done
          }
          C=$(latest core.yml); G=$(latest gui.yml); M=$(latest mobile.yml)
          if [ -z "$C" ] || [ -z "$G" ] || [ -z "$M" ]; then echo "trio incomplete yet"; exit 0; fi
          SC=${C#* }; SG=${G#* }; SM=${M#* }
          if [ "$SC" != "$SG" ] || [ "$SG" != "$SM" ]; then
            echo "trio shas differ ($SC $SG $SM) - a build is stale or pending, waiting"; exit 0
          fi
          # 同样不能用 releases/tags/{tag} 判存在：对草稿返回 404，会让这道闸门
          # 失效 —— 某条构建重跑一次就会再派发一次 release.yml。改用列表过滤。
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq --arg v "$V" '.[] | select(.tag_name==$v) | .id' | head -1)
          if [ -n "$existing" ]; then
            echo "release $V already exists (id $existing); re-assembly: dispatch release.yml manually"; exit 0
          fi
          gh workflow run release.yml \
            -f core_run_id="${C%% *}" -f gui_run_id="${G%% *}" -f mobile_run_id="${M%% *}" \
            -f version="$V" -f make_latest=true
          echo "==> dispatched release.yml for $V (run ids ${C%% *}/${G%% *}/${M%% *})"

