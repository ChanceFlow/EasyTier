name: EasyTier Release

on:
  workflow_dispatch:
    inputs:
      core_run_id:
        description: 'The run id of EasyTier-Core Action in EasyTier repo'
        type: number
        required: true
      version:
        description: 'Version for this release'
        type: string
        default: 'v2.7.0'
        required: true
      make_latest:
        description: 'Mark this release as latest'
        type: boolean
        default: true
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5

      - name: Download Core Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.core_run_id }}
          repo: ${{ github.repository }}
          path: release_assets

      - name: Zip release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir zipped_assets
          cd release_assets
          ls -l -R ./
          chmod -R 755 .
          for x in `ls`; do
            if [ "$x" = "Easytier-Magisk" ]; then
              # for Easytier-Magisk, make sure files are in the root of the zip
              cd $x;
              zip -r ../../zipped_assets/$x-${VERSION}.zip .;
              cd ..;
            else
              zip -r ../zipped_assets/$x-${VERSION}.zip $x;
            fi
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.version }}
          draft: true
          files: |
            ./zipped_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}

      # 去草稿必须在这里做，不能靠 release-publish.yml 的 workflow_run。
      #
      # assemble.yml 是用仓库自带的 GITHUB_TOKEN 调 `gh workflow run` 派发本工作流的，
      # 而 GitHub 会抑制由 GITHUB_TOKEN 产生的后续事件 —— 本工作流每次跑完，
      # Publish Release 都不会被触发（实测：Release 至今跑了多次，Publish 上一次
      # 运行还停在 8-31，且早于当天的 Release）。结果就是 release 一直挂在草稿里等人手动发。
      #
      # 放在 action-gh-release 之后，保证 33 个资产全部上传完才发布，
      # 避免出现"已发布但资产不全"的窗口。
      - name: Publish (un-draft) the assembled release
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 必须用 releases 列表按 tag_name 过滤：`releases/tags/{tag}` 对**草稿**
          # 返回 404（即使带认证），而 action-gh-release 建的正是一个草稿。
          # 这个坑实际踩过：步骤 404 导致整个 release.yml 被判失败，release 留在草稿。
          rid=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            | jq -r --arg v "${{ inputs.version }}" '.[] | select(.tag_name==$v) | .id' | head -1)
          if [ -z "$rid" ]; then
            echo "::error::找不到 ${{ inputs.version }} 对应的 release"
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$rid" \
            -f draft=false >/dev/null
          echo "==> un-drafted release ${{ inputs.version }} (id $rid)"

          # make_latest 必须**单独**再发一次，不能和 draft=false 放在同一个请求里。
          # 同一个请求里 GitHub 会拿**更新前**的状态（此时还是草稿）去判定 make_latest，
          # 于是静默忽略它 —— 不报错、返回 200，但 Latest 不会移动。
          # 实测 v2.7.0-chance.5：带 make_latest=true 的那次 PATCH 成功、release 也变成
          # draft=false，但十几分钟后 releases/latest 仍指向 chance.4；单独再 PATCH 一次
          # make_latest=true 后立刻生效（chance.5 latest=true，chance.4 latest=false）。
          # 影响面：每个 chance.N 都不会被标成 Latest，用户点 "Latest" 下到的是上一版。
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$rid" \
            -f make_latest=true >/dev/null
          echo "==> marked ${{ inputs.version }} as latest"
