name: EasyTier Flutter Client

# The Flutter client (easytier-flutter/) replaces the deprecated Tauri GUI.
# This workflow is intentionally cheap: static analysis + deterministic widget
# tests + goldens. Native builds (Rust cdylib via cargo-ndk, APK/appimage) need
# the toolchain matrix and land in a follow-up workflow.

on:
  push:
    branches: ["develop", "main", "releases/**"]
    paths:
      - "easytier-flutter/**"
      - "design-system/easytier-flutter/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "easytier-flutter/**"
      - "design-system/easytier-flutter/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easytier-flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install toolchain deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: pub get
        working-directory: easytier-flutter
        run: flutter pub get

      - name: analyze
        working-directory: easytier-flutter
        run: flutter analyze

      - name: widget tests (no goldens yet)
        working-directory: easytier-flutter
        run: flutter test --exclude-tags golden

      - name: design tokens contrast (M3 + WCAG)
        working-directory: easytier-flutter
        run: flutter test tool/check_tokens.dart

  goldens:
    runs-on: ubuntu-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: easytier-flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install toolchain deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: pub get
        working-directory: easytier-flutter
        run: flutter pub get

      # Goldens are rendered with the bundled fonts (no host fonts needed), so
      # no font installation step is required. CI *verifies* the committed
      # images; regenerating them is a reviewed local action
      # (`flutter test --update-goldens test/golden_test.dart`).
      - name: verify goldens
        working-directory: easytier-flutter
        run: flutter test test/golden_test.dart

      - name: upload goldens
        uses: actions/upload-artifact@v4
        with:
          name: flutter-goldens
          path: easytier-flutter/test/goldens/
          if-no-files-found: error
