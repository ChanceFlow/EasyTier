name: Publish Release

# Un-draft the release that Assemble Release dispatched (upstream's
# release.yml creates drafts for manual review; on this fork the pipeline
# is fully automated). Runs after the assembly workflow finishes.

on:
  workflow_run:
    workflows: ["EasyTier Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Un-draft the freshly assembled release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          found=0
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=5" \
            --jq '.[] | select(.draft) | .id' | while read -r id; do
              [ -n "$id" ] || continue
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f draft=false >/dev/null
              echo "==> published release $id"
            done
