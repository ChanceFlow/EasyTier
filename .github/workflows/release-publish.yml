name: Publish Release

# Un-draft the release that Assemble Release dispatched (upstream's
# release.yml creates drafts for manual review; on this fork the pipeline
# is fully automated). Runs after the assembly workflow finishes.

on:
  workflow_run:
    workflows: ["EasyTier Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Un-draft the freshly assembled release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only the release this assembly just created/updated. Matching EVERY
          # draft published unrelated ones the moment this ran (an old test
          # build and an aborted prerelease, whose assets then sat under the
          # wrong version tag). A freshly assembled draft is touched seconds
          # ago, so a 30 minute window isolates it.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" \
            --jq '.[] | select(.draft) | select((.updated_at | fromdateiso8601) > (now - 1800)) | .id' \
            | while read -r id; do
                [ -n "$id" ] || continue
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f draft=false >/dev/null
                echo "==> published release $id"
              done
